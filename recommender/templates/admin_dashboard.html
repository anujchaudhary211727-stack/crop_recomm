{% extends "base.html" %}
{% load static %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<h3 class="mb-3"><i class="fa-solid fa-gauge"></i> Admin Dashboard</h3>

<!-- TOP CARDS -->
<div class="row g-4 mb-4">

    <!-- USERS -->
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <div class="text-muted">Users</div>
                    <div class="h3">{{total_users}}</div>
                </div>
                <i class="fa-solid fa-users fa-2xl text-success"></i>
            </div>
        </div>
    </div>

    <!-- PREDICTIONS -->
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <div class="text-muted">Predictions</div>
                    <div class="h3">{{ total_predictions }}</div>
                </div>
                <i class="fa-solid fa-seedling fa-2xl text-success"></i>
            </div>
        </div>
    </div>

</div>

<!-- CHARTS -->
<div class="row g-4">

    <!-- BAR CHART -->
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body" style="height:350px;">
                <h5 class="mb-3">
                    <i class="fa-solid fa-chart-column"></i> Top Crops
                </h5>
                <canvas id="cropBar"></canvas>
            </div>
        </div>
    </div>

    <!-- LINE CHART -->
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body" style="height:350px;">
                <h5 class="mb-3">
                    <i class="fa-solid fa-chart-line"></i> Prediction (7 days)
                </h5>
                <canvas id="dailyLine"></canvas>
            </div>
        </div>
    </div>

</div>

<!-- CHART JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>

<script>

const cropLabels = {{ crop_labels|safe }};
const cropCounts = {{ crop_counts|safe }};
const dayLabels = {{ day_labels|safe }};
const dayCounts = {{ day_counts|safe }};

function makeOrReplaceChart(canvasId, config){
    const existing = Chart.getChart(canvasId);
    if(existing) existing.destroy();

    const canvas = document.getElementById(canvasId);
    if(!canvas) return;

    new Chart(canvas, config);
}

// BAR CHART
makeOrReplaceChart('cropBar',{
    type:'bar',
    data:{
        labels:cropLabels,
        datasets:[{
            label:'Top Crops',
            data:cropCounts
        }]
    },
    options:{
        responsive:true,
        maintainAspectRatio:false
    }
});

// LINE CHART
makeOrReplaceChart('dailyLine',{
    type:'line',
    data:{
        labels:dayLabels,
        datasets:[{
            label:'Predictions (7 days)',
            data:dayCounts
        }]
    },
    options:{
        responsive:true,
        maintainAspectRatio:false
    }
});

</script>

{% endblock %}
